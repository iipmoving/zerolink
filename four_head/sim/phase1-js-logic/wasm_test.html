<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EMC Logic WASM 对比测试</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #333; border-bottom: 3px solid #4CAF50; padding-bottom: 10px; }
        button { padding: 12px 24px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; font-size: 14px; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #2196F3; color: white; }
        .log { background: #1e1e1e; color: #d4d4d4; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; }
        .status { padding: 15px; margin: 20px 0; border-radius: 6px; font-weight: bold; }
        .success { background: #e8f5e9; color: #388e3c; }
        .error { background: #ffebee; color: #d32f2f; }
        .running { background: #fff3e0; color: #f57c00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 EMC Logic WASM 对比测试</h1>
        <p style="color: #666;">JS逻辑 vs C WASM - 纯前端实现，无需后端服务器</p>
        
        <div id="status" class="status">📋 准备就绪，点击"初始化"开始</div>
        
        <div>
            <button class="btn-primary" onclick="initialize()">🔧 初始化</button>
            <button class="btn-secondary" onclick="runTest('powerOn')">⚡ 上电自检</button>
            <button class="btn-secondary" onclick="runTest('keyPress')">👆 按键测试</button>
        </div>
        
        <h3>📝 测试日志</h3>
        <div class="log" id="logPanel">
            <div>系统就绪，等待初始化...</div>
        </div>
    </div>

    <!-- 加载必要的JS文件 -->
    <script src="js/state.js"></script>
    <script src="js/key_handler.js"></script>
    <script src="js/emc_logic_js.js"></script>
    <script src="js/wasm_comparison_tester.js"></script>
    
    <script>
        let tester = null;
        let isInitialized = false;
        
        function log(message, type = 'info') {
            const logPanel = document.getElementById('logPanel');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            entry.style.color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#51cf66' : '#d4d4d4';
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        async function initialize() {
            try {
                updateStatus('正在初始化...', 'running');
                log('初始化WASM对比测试工具...');
                
                tester = new WasmComparisonTester();
                
                // 初始化JS逻辑层
                await tester.initJSLogic();
                log('✅ JS逻辑层初始化成功', 'success');
                
                // 初始化WASM逻辑层
                await tester.initWasmLogic();
                log('✅ WASM逻辑层初始化成功', 'success');
                
                isInitialized = true;
                updateStatus('✅ 初始化完成，可以开始测试', 'success');
                log('系统就绪，请选择测试用例', 'success');
                
            } catch (error) {
                log(`❌ 初始化失败: ${error.message}`, 'error');
                updateStatus(`❌ 初始化失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function runTest(testName) {
            if (!isInitialized) {
                log('请先初始化', 'error');
                return;
            }
            
            const tests = {
                'powerOn': [
                    { action: 'wait', duration: 3000 }
                ],
                'keyPress': [
                    { action: 'wait', duration: 3000 },
                    { action: 'key_click', params: { keyCode: 1, holdTime: 50 } }
                ]
            };
            
            const testNames = {
                'powerOn': '上电自检',
                'keyPress': '按键测试'
            };
            
            log(`\n========== 开始测试: ${testNames[testName]} ==========`);
            updateStatus(`正在运行: ${testNames[testName]}`, 'running');
            
            try {
                const result = await tester.runTestSequence(
                    testNames[testName],
                    tests[testName]
                );
                
                log(`测试结果: ${result.passed ? '✅ PASS' : '❌ FAIL'}`, result.passed ? 'success' : 'error');
                updateStatus('测试完成', result.passed ? 'success' : 'error');
                
            } catch (error) {
                log(`测试失败: ${error.message}`, 'error');
                updateStatus(`测试失败: ${error.message}`, 'error');
            }
        }
        
        window.addEventListener('load', () => {
            log('页面加载完成，点击"初始化"开始测试');
        });
    </script>
</body>
</html>
