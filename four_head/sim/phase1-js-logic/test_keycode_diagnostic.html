<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按键事件诊断</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .panel {
            background: white;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .log {
            background: #f9f9f9;
            border-left: 4px solid #4CAF50;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .status {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔍 按键事件诊断工具</h1>
    
    <div class="panel">
        <h2>当前状态</h2>
        <div id="currentState" class="status">等待...</div>
    </div>
    
    <div class="panel">
        <h2>使用说明</h2>
        <p>1. 启动演示模式后，点击Canvas上的START_PAUSE键</p>
        <p>2. 观察日志中的键码和事件类型</p>
        <p>3. 对比前端发送的值与C代码定义是否一致</p>
        <button onclick="clearLog()">清空日志</button>
    </div>
    
    <div class="panel">
        <h2>详细日志</h2>
        <div id="log" class="log"></div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/config.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/emc_logic_js.js"></script>
    <script src="js/ems_wasm_adapter.js"></script>
    <script src="js/app.js"></script>

    <script>
        const STATE_NAMES = {
            0: 'S_POWER_ON', 1: 'S_VERSION', 2: 'S_SHUTDOWN',
            3: 'S_DEMO', 4: 'S_STANDBY', 5: 'S_FUNC_SELECT',
            6: 'S_COOKING', 7: 'S_PAUSE', 8: 'S_FAULT'
        };

        const KEY_NAMES = {
            1: 'M1', 2: 'M2', 3: 'M3', 4: 'M4', 5: 'M5',
            6: 'M6', 7: 'M7', 8: 'M8', 9: 'M9', 10: 'M10',
            11: 'ADD_WATER', 12: 'ADD_TIME', 13: 'START_PAUSE', 14: 'POWER'
        };

        const EVENT_NAMES = {
            0: 'NULL', 1: 'PRESS', 2: 'SHORT', 
            3: 'LONG', 4: 'REPEAT', 5: 'RELEASE'
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStateDisplay() {
            if (AppState.dllState && AppState.dllState.state !== null) {
                const stateCode = AppState.dllState.state;
                const stateName = STATE_NAMES[stateCode] || `UNKNOWN(${stateCode})`;
                document.getElementById('currentState').textContent = `${stateName} (${stateCode})`;
            }
        }

        // 拦截WASM的pressKey调用
        window.addEventListener('load', () => {
            log('页面加载完成', 'info');
            
            // 定期检查状态
            setInterval(updateStateDisplay, 200);
            
            // 拦截EmsWasmAdapter.pressKey
            if (window.EmsWasmAdapter) {
                const originalPressKey = EmsWasmAdapter.prototype.pressKey;
                EmsWasmAdapter.prototype.pressKey = function(keyCode, event) {
                    const keyName = KEY_NAMES[keyCode] || `KEY_${keyCode}`;
                    const eventName = EVENT_NAMES[event] || `EVENT_${event}`;
                    
                    log(`📤 [前端发送] keyCode=${keyCode} (${keyName}), event=${event} (${eventName})`, 'debug');
                    log(`   C代码定义: KEY_START_PAUSE=13, KEY_EVENT_LONG=3`, 'info');
                    
                    if (keyCode === 13 && event === 3) {
                        log(`   ✅ 键码和事件类型完全匹配C代码定义！`, 'success');
                    } else if (keyCode === 13) {
                        log(`   ⚠️ 键码正确，但事件类型可能不匹配`, 'warn');
                    }
                    
                    return originalPressKey.call(this, keyCode, event);
                };
                log('✅ 已拦截pressKey调用，准备记录按键事件', 'success');
            }
            
            // 拦截key_input_callback（如果可能）
            log('提示：请手动点击START_PAUSE键进行测试', 'info');
        });
    </script>
</body>
</html>
