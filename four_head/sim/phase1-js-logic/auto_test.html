<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按键通路自动化测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        #test-output {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 600px;
            overflow-y: auto;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>🔧 按键通路自动化测试</h1>
    
    <div>
        <button onclick="runTest()">运行测试</button>
        <button onclick="clearOutput()">清空输出</button>
    </div>
    
    <div id="test-output">点击"运行测试"按钮开始...</div>
    
    <!-- 加载所有必要的脚本 -->
    <script src="wasm/emc_test.js"></script>
    <script src="js/logic_layer_adapter.js"></script>
    <script src="js/js_emc_logic_adapter.js"></script>
    <script src="js/ems_wasm_adapter.js"></script>
    <script src="js/control_binder.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/config_converter.js"></script>
    <script src="js/config.js"></script>
    <script src="js/seg_display.js"></script>
    <script src="js/key_handler.js"></script>
    <script src="js/emc_logic_js.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // 捕获控制台输出
        const outputDiv = document.getElementById('test-output');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function appendOutput(text, className = '') {
            const line = document.createElement('div');
            line.className = className;
            line.textContent = text;
            outputDiv.appendChild(line);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            appendOutput(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            appendOutput('❌ ' + args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            appendOutput('⚠️  ' + args.join(' '), 'error');
        };
        
        async function runTest() {
            outputDiv.innerHTML = '';
            appendOutput('=== 开始初始化 ===', 'info');
            
            try {
                // 1. 加载配置
                appendOutput('\n[1] 加载配置...', 'info');
                await loadConfig('configs/default.json');
                appendOutput('✅ 配置加载完成', 'success');
                
                // 2. 切换到演示模式
                appendOutput('\n[2] 切换到演示模式...', 'info');
                await switchMode('demo');
                appendOutput('✅ 演示模式启动', 'success');
                
                // 3. 等待1秒让所有初始化完成
                appendOutput('\n[3] 等待初始化完成...', 'info');
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // 4. 运行按键通路测试
                appendOutput('\n[4] 运行按键通路测试...\n', 'info');
                runKeyPathTest();
                
            } catch (error) {
                appendOutput(`\n❌ 测试失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function runKeyPathTest() {
            console.log('=== 按键通路自动化测试开始 ===');
            
            // 检查必要的全局对象
            console.log('\n[步骤1] 检查全局对象...');
            const checks = [
                { name: 'AppState', exists: typeof AppState !== 'undefined' },
                { name: 'AppState.canvas', exists: AppState && AppState.canvas !== undefined },
                { name: 'AppState.logicLayer', exists: AppState && AppState.logicLayer !== undefined },
                { name: 'AppState.controls', exists: AppState && AppState.controls !== undefined },
                { name: 'setupCanvasEvents', exists: typeof setupCanvasEvents !== 'undefined' },
                { name: 'findControlByPosition', exists: typeof findControlByPosition !== 'undefined' }
            ];
            
            let allPassed = true;
            checks.forEach(check => {
                const status = check.exists ? '✅' : '❌';
                console.log(`  ${status} ${check.name}: ${check.exists ? '存在' : '不存在'}`);
                if (!check.exists) allPassed = false;
            });
            
            if (!allPassed) {
                console.error('\n❌ 关键对象缺失，测试终止');
                return;
            }
            
            // 检查控件列表
            console.log('\n[步骤2] 检查控件列表...');
            if (AppState.controls && AppState.controls.length > 0) {
                console.log(`  控件数量: ${AppState.controls.length}`);
                const buttons = AppState.controls.filter(c => c.type === 'button' || c.type === '按键');
                console.log(`  按键数量: ${buttons.length}`);
                
                if (buttons.length > 0) {
                    console.log('  第一个按键:', buttons[0].name);
                    console.log('  - 位置:', buttons[0].x, ',', buttons[0].y);
                    console.log('  - config:', buttons[0].config);
                }
            } else {
                console.error('  ❌ 没有控件！');
                return;
            }
            
            // 模拟点击"开始 / 暂停"键
            console.log('\n[步骤3] 查找"开始 / 暂停"键...');
            const startPauseBtn = AppState.controls.find(c => c.name === '开始 / 暂停');
            if (!startPauseBtn) {
                console.error('  ❌ 未找到"开始 / 暂停"键');
                return;
            }
            
            console.log('  ✅ 找到按键');
            
            // 计算点击坐标
            const clickX = startPauseBtn.x + startPauseBtn.width / 2;
            const clickY = startPauseBtn.y + startPauseBtn.height / 2;
            console.log(`  点击坐标: (${clickX}, ${clickY})`);
            
            // 测试findControlByPosition
            console.log('\n[步骤4] 测试findControlByPosition...');
            const foundControl = findControlByPosition(clickX, clickY);
            if (foundControl) {
                console.log('  ✅ 找到控件:', foundControl.name);
            } else {
                console.error('  ❌ 未找到控件');
                return;
            }
            
            // 获取keyCode
            console.log('\n[步骤5] 获取keyCode...');
            let keyCode = foundControl.config?.key_code;
            console.log('  config.key_code:', keyCode);
            
            if (keyCode === undefined || keyCode === null) {
                console.log('  key_code不存在，尝试从名称映射...');
                const KEY_NAME_MAP = {
                    '开始 / 暂停': 13,
                    '加水': 11,
                    '加时间': 12,
                    'M1': 1, 'M2': 2, 'M3': 3, 'M4': 4, 'M5': 5,
                    'M6': 6, 'M7': 7, 'M8': 8, 'M9': 9, 'M10': 10,
                    '电源': 0
                };
                keyCode = KEY_NAME_MAP[foundControl.name];
                console.log('  映射后的keyCode:', keyCode);
            }
            
            if (keyCode === undefined) {
                console.error('  ❌ 无法获取keyCode');
                return;
            }
            
            // 检查logicLayer
            console.log('\n[步骤6] 检查logicLayer...');
            if (!AppState.logicLayer) {
                console.error('  ❌ logicLayer不存在');
                return;
            }
            console.log('  logicLayer类型:', AppState.logicLayer.constructor.name);
            console.log('  pressKey方法:', typeof AppState.logicLayer.pressKey);
            
            // 模拟发送按键事件
            console.log('\n[步骤7] 模拟发送PRESS事件...');
            try {
                const pressEvent = window.KeyEvent ? KeyEvent.KEY_EVENT_PRESS : 1;
                console.log('  PRESS事件值:', pressEvent);
                
                AppState.logicLayer.pressKey(keyCode, pressEvent);
                console.log('  ✅ pressKey调用成功');
            } catch (error) {
                console.error('  ❌ pressKey调用失败:', error.message);
                return;
            }
            
            // 等待状态变化
            console.log('\n[步骤8] 等待状态变化...');
            setTimeout(() => {
                const currentState = AppState.logicLayer.getState();
                console.log('  当前状态:', currentState);
                
                if (currentState !== 2) {
                    console.log('  ✅ 状态已改变！按键通路正常');
                } else {
                    console.log('  ⚠️  状态未改变（S_SHUTDOWN状态下需要按特定键）');
                }
                
                console.log('\n=== 测试完成 ===');
            }, 100);
        }
        
        function clearOutput() {
            outputDiv.innerHTML = '点击"运行测试"按钮开始...';
        }
    </script>
</body>
</html>
