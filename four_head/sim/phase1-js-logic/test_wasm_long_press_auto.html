<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM长按自动化测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .panel {
            background: white;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .log {
            background: #f9f9f9;
            border-left: 4px solid #4CAF50;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .status {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🧪 WASM长按自动化测试</h1>
    
    <div class="panel">
        <h2>当前状态</h2>
        <div id="currentState" class="status">等待测试...</div>
    </div>
    
    <div class="panel">
        <h2>测试步骤</h2>
        <button onclick="runAutomatedTest()">▶️ 开始自动化测试</button>
        <button onclick="clearLog()">清空日志</button>
    </div>
    
    <div class="panel">
        <h2>详细日志</h2>
        <div id="log" class="log"></div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/config.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/logic_layer_adapter.js"></script>
    <script src="js/control_binder.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/emc_logic_js.js"></script>
    <script src="js/ems_wasm_adapter.js"></script>
    <script src="js/app.js"></script>

    <script>
        const TEST_STATE_NAMES = {
            0: 'S_POWER_ON', 1: 'S_VERSION', 2: 'S_SHUTDOWN',
            3: 'S_DEMO', 4: 'S_STANDBY', 5: 'S_FUNC_SELECT',
            6: 'S_COOKING', 7: 'S_PAUSE', 8: 'S_FAULT'
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const icons = {
                'info': 'ℹ️',
                'success': '✅',
                'error': '❌',
                'warn': '⚠️',
                'debug': '🔍'
            };
            logDiv.innerHTML += `<div>[${timestamp}] ${icons[type] || 'ℹ️'} ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStateDisplay() {
            if (AppState.dllState && AppState.dllState.state !== null) {
                const stateCode = AppState.dllState.state;
                const stateName = TEST_STATE_NAMES[stateCode] || `UNKNOWN(${stateCode})`;
                document.getElementById('currentState').textContent = `${stateName} (${stateCode})`;
                return stateCode;
            }
            return -1;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function waitForState(expectedState, timeout = 5000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                    const currentState = updateStateDisplay();
                    if (currentState === expectedState) {
                        clearInterval(checkInterval);
                        resolve();
                    } else if (Date.now() - startTime > timeout) {
                        clearInterval(checkInterval);
                        reject(new Error(`超时等待状态 ${TEST_STATE_NAMES[expectedState]}`));
                    }
                }, 100);
            });
        }

        async function simulateKeyPress(keyCode, holdDuration = 200) {
            const control = findControlByKeyCode(keyCode);
            if (!control) {
                throw new Error(`未找到KeyCode=${keyCode}的控件`);
            }

            log(`模拟按下: ${control.name} (KeyCode=${keyCode})`, 'debug');
            
            // 触发mousedown
            const mouseDownEvent = new MouseEvent('mousedown', {
                bubbles: true,
                cancelable: true,
                clientX: control.x + control.width / 2,
                clientY: control.y + control.height / 2
            });
            AppState.canvas.dispatchEvent(mouseDownEvent);

            // 等待指定时间
            await sleep(holdDuration);

            // 触发mouseup
            log(`模拟松开: ${control.name} (按住${holdDuration}ms)`, 'debug');
            const mouseUpEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true,
                clientX: control.x + control.width / 2,
                clientY: control.y + control.height / 2
            });
            AppState.canvas.dispatchEvent(mouseUpEvent);

            // 等待状态稳定
            await sleep(1000);
        }

        function findControlByKeyCode(keyCode) {
            if (!AppState.controls) return null;
            return AppState.controls.find(c => c.config && c.config.key_code === keyCode);
        }

        async function runAutomatedTest() {
            log('========== 开始WASM长按自动化测试 ==========');
            
            try {
                // 步骤0: 确保使用WASM逻辑层
                AppState.useWasm = true;
                log('✅ 已切换到WASM逻辑层', 'success');

                // 步骤1: 启动演示模式
                if (!AppState.logicLayer) {
                    log('步骤1: 启动WASM演示模式...', 'info');
                    startDemo('wasm');
                    await sleep(4000); // 等待上电自检完成
                }

                // 步骤2: 等待进入待机状态
                log('步骤2: 等待进入待机状态（S_STANDBY）...', 'info');
                await waitForState(4); // S_STANDBY = 4
                log('✅ 已进入待机状态', 'success');
                await sleep(500);

                // 步骤3: 按M1选择功能
                log('步骤3: 按M1选择功能...', 'info');
                await simulateKeyPress(1, 200); // KEY_M1 = 1
                await waitForState(5); // S_FUNC_SELECT = 5
                log('✅ 已进入功能选择状态', 'success');
                await sleep(500);

                // 步骤4: 按START_PAUSE开始烹饪
                log('步骤4: 按START_PAUSE开始烹饪...', 'info');
                await simulateKeyPress(13, 200); // KEY_START_PAUSE = 13
                await waitForState(6); // S_COOKING = 6
                log('✅ 已进入烹饪状态（S_COOKING）', 'success');
                await sleep(500);

                // 步骤5: 长按START_PAUSE 2秒
                log('步骤5: 🔥 长按START_PAUSE 2秒（关键测试）...', 'warn');
                log('   预期：应该从S_COOKING转移到S_STANDBY', 'info');
                await simulateKeyPress(13, 2000); // KEY_START_PAUSE = 13, 长按2秒
                
                // 检查结果
                const finalState = updateStateDisplay();

                log('========== 测试结果 ==========');
                
                if (finalState === 4) { // S_STANDBY
                    log('✅✅✅ 测试通过！成功从COOKING回到STANDBY', 'success');
                    log('C代码正确处理了LONG事件！', 'success');
                } else if (finalState === 7) { // S_PAUSE
                    log('❌ 测试失败！进入了PAUSE状态而不是STANDBY', 'error');
                    log('问题分析：前端可能发送了SHORT而不是LONG', 'error');
                } else if (finalState === 6) { // S_COOKING
                    log('❌ 测试失败！仍然在COOKING状态', 'error');
                    log('问题分析：LONG事件可能被忽略或C代码没有处理', 'error');
                } else {
                    log(`⚠️ 意外状态: ${TEST_STATE_NAMES[finalState]} (${finalState})`, 'warn');
                }

                log('========== 测试完成 ==========');

            } catch (error) {
                log(`❌ 测试出错: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // 监听状态变化
        window.addEventListener('load', () => {
            log('页面加载完成，准备就绪', 'info');
            
            // 定期检查状态
            setInterval(updateStateDisplay, 200);
            
            // 拦截pressKey调用，记录发送的事件
            if (window.EmsWasmAdapter) {
                const originalPressKey = EmsWasmAdapter.prototype.pressKey;
                EmsWasmAdapter.prototype.pressKey = function(keyCode, event) {
                    const eventName = ['NULL', 'PRESS', 'SHORT', 'LONG', 'REPEAT', 'RELEASE'][event] || `UNKNOWN(${event})`;
                    log(`📤 [前端发送] keyCode=${keyCode}, event=${event} (${eventName})`, 'debug');
                    return originalPressKey.call(this, keyCode, event);
                };
            }
        });
    </script>
</body>
</html>
