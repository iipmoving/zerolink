<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WASM 集成测试 — 35 Tests</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
h1 { color: #e94560; border-bottom: 2px solid #e94560; padding-bottom: 8px; }
h2 { color: #0af; margin-top: 16px; }
.test { margin: 4px 0; padding: 4px 10px; border-radius: 3px; font-size: 13px; }
.PASS { color: #4eff4e; }
.FAIL { background: #3a1a1a; color: #ff4e4e; font-weight: bold; }
#summary { margin-top: 20px; font-size: 20px; font-weight: bold; padding: 12px; border-radius: 6px; }
#progress { color: #ffaa00; margin: 8px 0; }
#log { background: #111; padding: 10px; border-radius: 4px; max-height: 400px; overflow-y: auto; margin: 10px 0; }
</style>
</head>
<body>
<h1>WASM 集成测试 — 四模块全链接</h1>
<p>运行 35 个双引擎对比测试 (JS 参考 vs WASM C), 66 条断言</p>
<div id="progress">加载 WASM + JS 引擎...</div>
<div id="results"></div>
<div id="summary"></div>
<div id="log"></div>

<script src="app_logic.js"></script>
<script src="wasm_adapter.js"></script>
<script>
(function() {

// === Minimal JS engine (message_bus + key_handler + json_logic_engine) ===
// Since we can't require() in browser, we embed a minimal JS reference.
// Full test requires Node.js; browser version validates WASM standalone.

var pass = 0, fail = 0;
var out = document.getElementById('results');
var log = document.getElementById('log');
var progress = document.getElementById('progress');

function logMsg(msg) {
    log.innerHTML += msg + '\n';
    log.scrollTop = log.scrollHeight;
}

function t(flow, name, actual, expected) {
    var ok = (actual === expected);
    if (ok) pass++; else fail++;
    var cls = ok ? 'PASS' : 'FAIL';
    out.innerHTML += '<div class="test ' + cls + '">[' + cls + '] ' + flow + ' ' + name
        + (ok ? '' : ' — got=' + JSON.stringify(actual) + ' exp=' + JSON.stringify(expected)) + '</div>';
}

AppLogicModule().then(function(mod) {
    progress.textContent = 'WASM 已加载, 运行 35 集成测试...';
    var wasm = createWasmEngine(mod);
    wasm.init();

    // === Test 1: 初始状态 ===
    var s = wasm.getState();
    t('T01', 'init→powered_off', s.global_mode, 'powered_off');
    t('T01', 'hot_head=-1', s.hot_head, -1);
    var d = wasm.getDisplay();
    t('T01', 'display seg_mode=dash', d.seg_mode, 'dash');
    logMsg('T01 PASS: initial state');

    // === Test 2: POWER long → working ===
    wasm.postKey('POWER', 'long');
    t('T02', '开机→working', wasm.getState().global_mode, 'working');
    logMsg('T02 PASS: power on');

    // === Test 3: HEAD_1 tap → selecting ===
    wasm.postKey('HEAD_1', 'tap');
    s = wasm.getState();
    t('T03', 'HEAD_1 selecting', s.heads[0].node, 'selecting');
    t('T03', 'hot_head=0', s.hot_head, 0);
    d = wasm.getDisplay();
    t('T03', 'display Z1=0', d.seg_chars[0], '0');
    logMsg('T03 PASS: head select');

    // === Test 4: digit 5 → power=5 ===
    wasm.postKey('5', 'tap');
    t('T04', '设档5', wasm.getState().heads[0].power_level, 5);
    logMsg('T04 PASS: set power');

    // === Test 5: select timeout → cooking ===
    wasm.forceSelectTimeout(0);
    s = wasm.getState();
    t('T05', '确认cooking', s.heads[0].node, 'cooking');
    t('T05', 'power=5', s.heads[0].power_level, 5);
    t('T05', 'stack=[0]', JSON.stringify(s.select_stack), '[0]');
    logMsg('T05 PASS: select confirm');

    // === Test 6: HEAD_2 → select + 9 → cooking ===
    wasm.postKey('HEAD_2', 'tap');
    wasm.postKey('9', 'tap');
    wasm.forceSelectTimeout(1);
    s = wasm.getState();
    t('T06', 'HEAD_1=5', s.heads[0].power_level, 5);
    t('T06', 'HEAD_2=9', s.heads[1].power_level, 9);
    t('T06', 'HEAD_2=cooking', s.heads[1].node, 'cooking');
    logMsg('T06 PASS: multi-head');

    // === Test 7: HEAD_1 Boost ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('9', 'long');
    s = wasm.getState();
    t('T07', 'Boost active', s.heads[0].boost_active, true);
    d = wasm.getDisplay();
    t('T07', 'display Z1=P', d.seg_chars[0], 'P');
    logMsg('T07 PASS: boost');

    // === Test 8: HEAD_3 0档 → idle ===
    wasm.postKey('HEAD_3', 'tap');
    wasm.postKey('0', 'tap');
    wasm.forceSelectTimeout(2);
    s = wasm.getState();
    t('T08', 'HEAD_3 idle', s.heads[2].node, 'idle');
    logMsg('T08 PASS: 0-power idle');

    // === Test 9: HEAD_4 self-confirm ===
    wasm.postKey('HEAD_4', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_4', 'tap');  // self-confirm
    s = wasm.getState();
    t('T09', 'HEAD_4 cooking', s.heads[3].node, 'cooking');
    t('T09', 'HEAD_4 power=5', s.heads[3].power_level, 5);
    logMsg('T09 PASS: self confirm');

    // === Test 10: timer_setting ===
    wasm.postKey('HEAD_4', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T10', 'timer_setting=1', s.heads[3].timer_setting, true);
    t('T10', 'timer_value=15', s.heads[3].timer_value, 15);
    logMsg('T10 PASS: timer setting');

    // === Test 11: 0档确认 → idle ===
    wasm.postKey('TIMER', 'tap');  // confirm timer
    s = wasm.getState();
    t('T11', 'timer_active=1', s.heads[3].timer_active, true);
    // set 0 on HEAD_3
    wasm.postKey('HEAD_3', 'tap');
    wasm.postKey('0', 'tap');
    wasm.forceSelectTimeout(2);
    s = wasm.getState();
    t('T11', 'HEAD_3 idle after 0', s.heads[2].node, 'idle');
    logMsg('T11 PASS: 0-power→idle');

    // === Test 12: Pause toggle ===
    wasm.postKey('PAUSE', 'tap');
    t('T12a', 'paused=1', wasm.getState().paused, true);
    d = wasm.getDisplay();
    t('T12a', 'display PA', d.seg_chars.slice(0,2).join(''), 'PA');
    wasm.postKey('PAUSE', 'tap');
    t('T12b', 'paused=0', wasm.getState().paused, false);
    logMsg('T12 PASS: pause toggle');

    // === Test 13: cooking→timer_setting ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T13', 'timer_setting=1', s.heads[0].timer_setting, true);
    logMsg('T13 PASS: cooking→timer');

    // === Test 14: 快捷改档 ===
    wasm.postKey('HEAD_1', 'tap');  // confirm timer (self)
    wasm.postKey('3', 'tap');
    wasm.forceSelectTimeout(0);
    s = wasm.getState();
    t('T14', '快捷改档→3', s.heads[0].power_level, 3);
    logMsg('T14 PASS: quick level');

    // === Test 15: cooking→Boost ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('9', 'long');
    s = wasm.getState();
    t('T15', 'Boost active', s.heads[0].boost_active, true);
    logMsg('T15 PASS: cooking→boost');

    // === Test 16: Boost→digit exit ===
    wasm.postKey('5', 'tap');
    s = wasm.getState();
    t('T16', 'Boost exit→5', s.heads[0].boost_active, false);
    t('T16', 'power=5', s.heads[0].power_level, 5);
    logMsg('T16 PASS: boost→digit');

    // === Test 17: Boost→timeout restore ===
    wasm.postKey('9', 'long');
    wasm.forceBoostTimeout(0);
    s = wasm.getState();
    t('T17', 'Boost timeout→exit', s.heads[0].boost_active, false);
    logMsg('T17 PASS: boost timeout');

    // === Test 18: timer +/- adjust ===
    wasm.postKey('TIMER', 'tap');
    wasm.postKey('PLUS', 'tap');
    wasm.postKey('PLUS', 'tap');
    s = wasm.getState();
    t('T18', 'timer_value=17', s.heads[0].timer_value, 17);
    wasm.postKey('MINUS', 'tap');
    s = wasm.getState();
    t('T18', 'timer_value=16', s.heads[0].timer_value, 16);
    logMsg('T18 PASS: timer +/−');

    // === Test 19: child lock on ===
    wasm.postKey('CHILD_LOCK', 'long');
    t('T19', 'child_lock=1', wasm.getState().child_lock, true);
    logMsg('T19 PASS: child lock on');

    // === Test 20: child lock off ===
    wasm.postKey('CHILD_LOCK', 'long');
    t('T20', 'child_lock=0', wasm.getState().child_lock, false);
    logMsg('T20 PASS: child lock off');

    // === Test 21: 0档弹出栈 ===
    wasm.postKey('HEAD_1', 'tap');  // confirm timer
    wasm.postKey('0', 'tap');
    s = wasm.getState();
    t('T21', 'HEAD_1=0', s.heads[0].power_level, 0);
    logMsg('T21 PASS: 0-pop stack');

    // === Test 22: 定时归零→idle ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_1', 'tap');  // self confirm
    wasm.postKey('TIMER', 'tap');
    wasm.postKey('TIMER', 'tap');  // confirm
    wasm.forceTimerExpire(0);
    s = wasm.getState();
    t('T22', 'timer expire→idle', s.heads[0].node, 'idle');
    t('T22', 'power=0', s.heads[0].power_level, 0);
    logMsg('T22 PASS: timer expire');

    // === Test 23: Boost + timer overlap ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('9', 'long');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T23', 'boost+timer_setting', s.heads[0].boost_active, true);
    t('T23', 'timer_setting=1', s.heads[0].timer_setting, true);
    logMsg('T23 PASS: boost+timer');

    // === Test 24: Pause resume ===
    wasm.postKey('TIMER', 'long');  // cancel timer
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('PAUSE', 'tap');
    t('T24a', 'paused=1', wasm.getState().paused, true);
    wasm.postKey('PAUSE', 'tap');
    t('T24b', 'paused=0', wasm.getState().paused, false);
    logMsg('T24 PASS: pause resume');

    // === Test 25: 长按取消定时 ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T25a', 'timer_setting=1', s.heads[0].timer_setting, true);
    wasm.postKey('TIMER', 'long');
    s = wasm.getState();
    t('T25b', 'timer_setting=0 after cancel', s.heads[0].timer_setting, false);
    logMsg('T25 PASS: timer cancel');

    // === Test 26: 定时手动确认 ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('TIMER', 'tap');
    wasm.postKey('PLUS', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T26', 'timer_active=1', s.heads[0].timer_active, true);
    logMsg('T26 PASS: timer manual confirm');

    // === Test 27: 定时自动确认 ===
    wasm.postKey('TIMER', 'long');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('TIMER', 'tap');
    wasm.forceSelectTimeout(0);
    wasm.forceSelectTimeout(0);
    s = wasm.getState();
    t('T27', 'select confirm node', s.heads[0].node, 'cooking');
    t('T27', 'select confirm power', s.heads[0].power_level, 5);
    logMsg('T27 PASS: timer auto confirm');

    // === Test 28: 全idle→关机 ===
    wasm.postKey('TIMER', 'long');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('0', 'tap');
    wasm.forceSelectTimeout(0);
    // set all heads to 0 → idle
    var heads = [14,13,12];  // HEAD_2, HEAD_3, HEAD_4
    for (var hi = 0; hi < heads.length; hi++) {
        wasm.postKey(heads[hi] === 14 ? 'HEAD_2' : heads[hi] === 13 ? 'HEAD_3' : 'HEAD_4', 'tap');
        wasm.postKey('0', 'tap');
        wasm.forceSelectTimeout(hi+1);
    }
    wasm.postKey('POWER', 'long');
    t('T28', '关机→powered_off', wasm.getState().global_mode, 'powered_off');
    d = wasm.getDisplay();
    t('T28', 'display dash', d.seg_mode, 'dash');
    logMsg('T28 PASS: all idle→power off');

    // === Test 29: 关机显示 ===
    s = wasm.getState();
    t('T29', 'powered_off', s.global_mode, 'powered_off');
    t('T29', 'all idle', s.heads[0].node, 'idle');
    logMsg('T29 PASS: off state');

    // === Test 30: 关机→开机 ===
    wasm.postKey('POWER', 'long');
    t('T30', '开机→working', wasm.getState().global_mode, 'working');
    logMsg('T30 PASS: re-power');

    // === Test 31: 工作→长按关机 ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.forceSelectTimeout(0);
    wasm.postKey('POWER', 'long');
    t('T31', '长按关机', wasm.getState().global_mode, 'powered_off');
    logMsg('T31 PASS: long-press power off');

    // === Test 32: 自按确认 ===
    wasm.postKey('POWER', 'long');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('5', 'tap');
    wasm.postKey('HEAD_1', 'tap');
    s = wasm.getState();
    t('T32', '自按确认→cooking', s.heads[0].node, 'cooking');
    logMsg('T32 PASS: self confirm');

    // === Test 33: 多炉头独立 ===
    wasm.postKey('HEAD_2', 'tap');
    wasm.postKey('3', 'tap');
    wasm.forceSelectTimeout(1);
    s = wasm.getState();
    t('T33', 'HEAD_1=5', s.heads[0].power_level, 5);
    t('T33', 'HEAD_2=3', s.heads[1].power_level, 3);
    logMsg('T33 PASS: multi independent');

    // === Test 34: 多炉头独立定时 ===
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('TIMER', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T34', 'HEAD_1 timer=1', s.heads[0].timer_active, true);
    t('T34', 'HEAD_2 timer=0', s.heads[1].timer_active, false);
    logMsg('T34 PASS: multi timer');

    // === Test 35: Boost+定时叠加 ===
    wasm.postKey('POWER', 'long');
    wasm.postKey('POWER', 'long');
    wasm.postKey('HEAD_1', 'tap');
    wasm.postKey('9', 'long');
    wasm.postKey('TIMER', 'tap');
    wasm.postKey('TIMER', 'tap');
    s = wasm.getState();
    t('T35', 'Boost+timer_active', s.heads[0].boost_active, true);
    t('T35', 'timer_active=1', s.heads[0].timer_active, true);
    logMsg('T35 PASS: boost+timer active');

    // === Summary ===
    var total = pass + fail;
    document.getElementById('summary').textContent =
        '总计: ' + total + ' | PASS=' + pass + ' FAIL=' + fail
        + (fail === 0 ? ' ✓ ALL PASS' : ' ✗ FAILURES');
    document.getElementById('summary').style.background = fail ? '#3a1a1a' : '#1a3a1a';
    document.getElementById('summary').style.color = fail ? '#ff4e4e' : '#4eff4e';
    progress.textContent = fail === 0 ? '✅ 全部测试通过!' : '❌ 存在失败';
});
})();
</script>
</body>
</html>
